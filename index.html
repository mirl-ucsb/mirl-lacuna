<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIRL Lacuna · a catalogue of an absent archive</title>
<meta name="description" content="A local-first catalogue for archives that no longer exist: destroyed, looted, dispersed, and unlocated works, recorded with evidence, consent states, and dignity. A no-build tool from the Material / Image Research Lab, UCSB.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app">
  <div class="plate">
    <h1>MIRL&nbsp;Lacuna</h1>
    <span class="tag">a catalogue of an absent archive</span>
  </div>
  <a class="lab" href="https://mirl.arthistory.ucsb.edu" target="_blank" rel="noopener">Material&nbsp;/&nbsp;Image Research Lab</a>
</header>

<nav class="folio">
  <div class="views">
    <button class="view on" data-view="register"><span class="fol">Fol. I</span>Register</button>
    <button class="view" data-view="entry"><span class="fol">Fol. II</span>Entry</button>
    <button class="view" data-view="statistics"><span class="fol">Fol. III</span>Statistics</button>
    <button class="view" data-view="atlas"><span class="fol">Fol. IV</span>Atlas</button>
  </div>
  <div class="tools">
    <button class="btn" id="new-entry-btn" title="Open a new entry in the register">New entry</button>
    <div class="menu-wrap">
      <button class="btn" id="project-btn">Project &#9662;</button>
      <div class="menu hidden" id="project-menu">
        <button data-act="save">Save project (.json)<small>your full working file; restricted evidence stays in it</small></button>
        <button data-act="open">Open project (.json)</button>
        <hr>
        <button data-act="new">New register<small>start empty</small></button>
        <button data-act="sample">Open the sample register<small>a fictional studio archive, for trying things</small></button>
      </div>
    </div>
    <div class="menu-wrap">
      <button class="btn" id="export-btn">Export &#9662;</button>
      <div class="menu hidden" id="export-menu">
        <button data-act="aid">Finding aid (.html)<small>one self-contained page: register, notices, atlas</small></button>
        <button data-act="csv">Register as spreadsheet (.csv)</button>
        <button data-act="json">Public data (.json)</button>
        <hr>
        <button data-act="print">Print this view</button>
      </div>
    </div>
  </div>
</nav>

<main>
  <section class="view" id="view-register"></section>
  <section class="view hidden" id="view-entry"></section>
  <section class="view hidden" id="view-statistics"></section>
  <section class="view hidden" id="view-atlas"></section>
</main>

<div class="toast" id="toast"></div>
<input type="file" id="file-input" class="sr">
<input type="file" id="project-input" accept="application/json,.json" class="sr">

<script src="vendor/openseadragon.min.js"></script>
<script src="vendor/land.js"></script>
<script src="samples/sample-data.js"></script>
<script src="js/model.js"></script>
<script src="js/citation.js"></script>
<script src="js/register.js"></script>
<script src="js/record.js"></script>
<script src="js/stats.js"></script>
<script src="js/atlas.js"></script>
<script src="js/exporters.js"></script>
<script src="js/app.js"></script>
</body>
</html>
