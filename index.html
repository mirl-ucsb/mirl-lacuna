<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIRL Lacuna · a catalogue of an absent archive</title>
<meta name="description" content="A local-first catalogue for archives that no longer exist: destroyed, looted, dispersed, and unlocated works, recorded with evidence, consent states, and dignity. A no-build tool from the Material / Image Research Lab, UCSB.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to the register</a>

<header class="app">
  <div class="plate">
    <h1>MIRL&nbsp;Lacuna</h1>
    <span class="tag">a catalogue of an absent archive</span>
  </div>
  <a class="lab" href="https://mirl.arthistory.ucsb.edu" target="_blank" rel="noopener">Material&nbsp;/&nbsp;Image Research Lab<span class="uni">University of California, Santa&nbsp;Barbara</span></a>
</header>

<nav class="folio">
  <div class="views">
    <button class="view on" data-view="register"><span class="fol">Fol. I</span>Register</button>
    <button class="view" data-view="entry"><span class="fol">Fol. II</span>Entry</button>
    <button class="view" data-view="timeline"><span class="fol">Fol. III</span>Timeline</button>
    <button class="view" data-view="statistics"><span class="fol">Fol. IV</span>Statistics</button>
    <button class="view" data-view="atlas"><span class="fol">Fol. V</span>Atlas</button>
    <button class="view" data-view="index"><span class="fol">Fol. VI</span>Index</button>
  </div>
  <div class="tools">
    <span class="save-state" id="save-state" aria-live="polite" title="Your work autosaves in this browser"></span>
    <button class="btn" id="new-entry-btn" title="Open a new entry in the register">New entry</button>
    <div class="menu-wrap">
      <button class="btn" id="project-btn">Project &#9662;</button>
      <div class="menu hidden" id="project-menu">
        <button data-act="save">Save project (.json)<small>your full working file; restricted evidence stays in it</small></button>
        <button data-act="open">Open project (.json)</button>
        <button data-act="disk" id="disk-item">Keep the file on disk<small>save continuously to a .json you choose, alongside the browser autosave</small></button>
        <button data-act="lock" id="lock-item">Lock this register<small>a passphrase encrypts the file at rest; exports stay plain</small></button>
        <hr>
        <button data-act="sources">Sources and narrators<small>the people the register rests on; aliases publish, identities never do</small></button>
        <hr>
        <button data-act="csv">Import entries (.csv)<small>an old inventory becomes draft entries, held back until published</small></button>
        <button data-act="merge">Merge a project (.json)<small>a colleague's register, reconciled entry by entry</small></button>
        <button data-act="fixity">Check evidence files<small>verify files against their recorded sha-256 fingerprints</small></button>
        <hr>
        <button data-act="new">New register<small>start empty</small></button>
        <button data-act="sample">Open the sample register<small>a fictional studio archive, for trying things</small></button>
      </div>
    </div>
    <div class="menu-wrap">
      <button class="btn" id="export-btn">Export &#9662;</button>
      <div class="menu hidden" id="export-menu">
        <button data-act="aid">Finding aid (.html)<small>one self-contained page: register, notices, atlas</small></button>
        <button data-act="book">Print as a memorial book<small>a cover leaf, one notice per page, the register and index as appendices</small></button>
        <button data-act="notice">Notice for circulation (print)<small>the open entry as a one-page appeal: last seen, whom to tell</small></button>
        <button data-act="csv">Register as spreadsheet (.csv)</button>
        <button data-act="json">Public data (.json)</button>
        <button data-act="geojson">Places as GeoJSON (.geojson)<small>publishable located places, for QGIS or a web map</small></button>
        <hr>
        <button data-act="print">Print this view</button>
      </div>
    </div>
  </div>
</nav>

<main id="main" tabindex="-1">
  <section class="view" id="view-register"></section>
  <section class="view hidden" id="view-entry"></section>
  <section class="view hidden" id="view-timeline"></section>
  <section class="view hidden" id="view-statistics"></section>
  <section class="view hidden" id="view-atlas"></section>
  <section class="view hidden" id="view-index"></section>
</main>

<div class="toast" id="toast"></div>
<input type="file" id="file-input" class="sr">
<input type="file" id="project-input" accept="application/json,.json" class="sr">
<input type="file" id="csv-input" accept=".csv,text/csv" class="sr">
<input type="file" id="merge-input" accept="application/json,.json" class="sr">
<input type="file" id="fixity-input" multiple class="sr">

<script src="vendor/openseadragon.min.js"></script>
<script src="vendor/land.js"></script>
<script src="vendor/gazetteer.js"></script>
<script src="samples/sample-data.js"></script>
<script src="js/model.js"></script>
<script src="js/geocode.js"></script>
<script src="js/citation.js"></script>
<script src="js/register.js"></script>
<script src="js/record.js"></script>
<script src="js/timeline.js"></script>
<script src="js/stats.js"></script>
<script src="js/atlas.js"></script>
<script src="js/indexes.js"></script>
<script src="js/importers.js"></script>
<script src="js/exporters.js"></script>
<script src="js/app.js"></script>
</body>
</html>
